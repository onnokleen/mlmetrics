<script>
(function () {
  // The account endpoint is public; set it to an empty string to disable analytics.
  const endpoint = "https://mlmetrics.goatcounter.com/count";
  const productionHosts = ["mlmetrics.org", "www.mlmetrics.org"];

  if (!endpoint ||
      !productionHosts.includes(window.location.hostname) ||
      navigator.doNotTrack === "1" ||
      navigator.globalPrivacyControl === true) {
    return;
  }

  window.goatcounter = {
    no_events: true,
    path: window.location.pathname,
    referrer: function () {
      try {
        return new URL(document.referrer).origin;
      } catch (_) {
        return "";
      }
    }
  };

  const script = document.createElement("script");
  script.dataset.goatcounter = endpoint;
  script.async = true;
  script.referrerPolicy = "no-referrer";
  script.src = "https://gc.zgo.at/count.js";
  document.head.appendChild(script);
})();
</script>
