:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;

  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

}

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  corner-shape: superellipse(1.5);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:focus-visible {

.form-check {

  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;optimizer-lab-sketch&quot;);
  const svg = root.querySelector(&quot;svg&quot;);
  const wrap = root.querySelector(&quot;.plot-wrap&quot;);
  const status = root.querySelector(&quot;.status&quot;);
  const description = root.querySelector(&quot;#optimizer-lab-description&quot;);
  const inputs = {
    eta: root.querySelector(&#x27;[data-input=&quot;eta&quot;]&#x27;),
    beta: root.querySelector(&#x27;[data-input=&quot;beta&quot;]&#x27;),
    kappa: root.querySelector(&#x27;[data-input=&quot;kappa&quot;]&#x27;)
  };
  const outputs = {
    eta: root.querySelector(&#x27;[data-value=&quot;eta&quot;]&#x27;),
    beta: root.querySelector(&#x27;[data-value=&quot;beta&quot;]&#x27;),
    kappa: root.querySelector(&#x27;[data-value=&quot;kappa&quot;]&#x27;)
  };
  const ns = &quot;http://www.w3.org/2000/svg&quot;;

  function add(parent, tag, attrs = {}, text = &quot;&quot;) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    if (text) node.textContent = text;
    parent.appendChild(node);
    return node;
  }

  function simulate(eta, beta, kappa) {
    let x = -4;
    let y = 3;
    let vx = 0;
    let vy = 0;
    const points = [{ x, y, loss: 0.5 * (x * x + kappa * y * y) }];

    for (let iteration = 1; iteration &lt;= 30; iteration += 1) {
      vx = beta * vx + x;
      vy = beta * vy + kappa * y;
      x -= eta * vx;
      y -= eta * vy;
      const loss = 0.5 * (x * x + kappa * y * y);
      points.push({ x, y, loss });
      if (!Number.isFinite(loss) || Math.abs(x) &gt; 10000 || Math.abs(y) &gt; 10000) break;
    }
    return points;
  }

  function pathFrom(points, xScale, yScale) {
    return points.map((point, index) =&gt; `${index === 0 ? &quot;M&quot; : &quot;L&quot;}${xScale(point.x)},${yScale(point.y)}`).join(&quot; &quot;);
  }

  function render() {
    const eta = Number(inputs.eta.value);
    const beta = Number(inputs.beta.value);
    const kappa = Number(inputs.kappa.value);
    outputs.eta.value = eta.toFixed(2);
    outputs.beta.value = beta.toFixed(2);
    outputs.kappa.value = kappa.toFixed(0);

    const points = simulate(eta, beta, kappa);
    const initialLoss = points[0].loss;
    const finalPoint = points[points.length - 1];
    const diverged = !Number.isFinite(finalPoint.loss) || finalPoint.loss &gt; initialLoss * 4 || Math.abs(finalPoint.x) &gt; 20 || Math.abs(finalPoint.y) &gt; 20;
    const converged = !diverged &amp;&amp; Math.hypot(finalPoint.x, finalPoint.y) &lt; 0.08;
    const result = diverged ? `diverges after ${points.length - 1} steps` : converged ? `converges in ${points.length - 1} steps` : `has not converged after ${points.length - 1} steps`;
    const lossLabel = Number.isFinite(finalPoint.loss) ? finalPoint.loss.toExponential(2) : &quot;∞&quot;;
    status.textContent = `Starting at (−4, 3), the optimizer ${result}; final loss = ${lossLabel}.`;
    description.textContent = `The trajectory ${result} on a quadratic objective with condition number ${kappa}. The final loss is ${lossLabel}.`;

    const width = Math.max(320, Math.floor(wrap.getBoundingClientRect().width));
    const stacked = width &lt; 560;
    const height = stacked ? 650 : 390;
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);
    svg.replaceChildren();

    const contourPanel = stacked
      ? { x: 55, y: 30, w: width - 100, h: 285 }
      : { x: 55, y: 30, w: Math.floor(width * 0.59) - 70, h: 300 };
    const lossPanel = stacked
      ? { x: 55, y: 390, w: width - 100, h: 205 }
      : { x: Math.floor(width * 0.62), y: 30, w: width - Math.floor(width * 0.62) - 25, h: 300 };

    const defs = add(svg, &quot;defs&quot;);
    const contourClip = add(defs, &quot;clipPath&quot;, { id: &quot;optimizer-contour-clip&quot; });
    add(contourClip, &quot;rect&quot;, { x: contourPanel.x, y: contourPanel.y, width: contourPanel.w, height: contourPanel.h });
    const lossClip = add(defs, &quot;clipPath&quot;, { id: &quot;optimizer-loss-clip&quot; });
    add(lossClip, &quot;rect&quot;, { x: lossPanel.x, y: lossPanel.y, width: lossPanel.w, height: lossPanel.h });

    const domainMin = -5;
    const domainMax = 5;
    const xScale = value =&gt; contourPanel.x + ((value - domainMin) / (domainMax - domainMin)) * contourPanel.w;
    const yScale = value =&gt; contourPanel.y + contourPanel.h - ((value - domainMin) / (domainMax - domainMin)) * contourPanel.h;

    add(svg, &quot;text&quot;, { x: contourPanel.x, y: contourPanel.y - 11, class: &quot;plot-title&quot; }, &quot;Parameter path&quot;);
    add(svg, &quot;rect&quot;, { x: contourPanel.x, y: contourPanel.y, width: contourPanel.w, height: contourPanel.h, class: &quot;frame&quot;, &quot;data-chart-frame&quot;: &quot;&quot; });
    add(svg, &quot;line&quot;, { x1: xScale(0), x2: xScale(0), y1: contourPanel.y, y2: contourPanel.y + contourPanel.h, class: &quot;axis-line&quot; });
    add(svg, &quot;line&quot;, { x1: contourPanel.x, x2: contourPanel.x + contourPanel.w, y1: yScale(0), y2: yScale(0), class: &quot;axis-line&quot; });

    [-5, 0, 5].forEach(value =&gt; {
      add(svg, &quot;text&quot;, { x: xScale(value), y: contourPanel.y + contourPanel.h + 19, &quot;text-anchor&quot;: value === -5 ? &quot;start&quot; : value === 5 ? &quot;end&quot; : &quot;middle&quot; }, String(value));
      add(svg, &quot;text&quot;, { x: contourPanel.x - 9, y: yScale(value) + 4, &quot;text-anchor&quot;: &quot;end&quot; }, String(value));
    });
    add(svg, &quot;text&quot;, { x: contourPanel.x + contourPanel.w / 2, y: contourPanel.y + contourPanel.h + 40, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;x&quot; }, &quot;Parameter θ₁&quot;);
    add(svg, &quot;text&quot;, { x: contourPanel.x - 38, y: contourPanel.y + contourPanel.h / 2, transform: `rotate(-90 ${contourPanel.x - 38} ${contourPanel.y + contourPanel.h / 2})`, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot; }, &quot;Parameter θ₂&quot;);

    const contourGroup = add(svg, &quot;g&quot;, { &quot;clip-path&quot;: &quot;url(#optimizer-contour-clip)&quot; });
    [0.06, 0.14, 0.30, 0.60, 1.10].forEach(fraction =&gt; {
      const level = initialLoss * fraction;
      const rx = Math.sqrt(2 * level);
      const ry = Math.sqrt((2 * level) / kappa);
      const ellipse = [];
      for (let index = 0; index &lt;= 120; index += 1) {
        const angle = (index / 120) * 2 * Math.PI;
        ellipse.push({ x: rx * Math.cos(angle), y: ry * Math.sin(angle) });
      }
      add(contourGroup, &quot;path&quot;, { d: pathFrom(ellipse, xScale, yScale), class: &quot;contour&quot; });
    });

    add(contourGroup, &quot;path&quot;, { d: pathFrom(points, xScale, yScale), class: &quot;trajectory&quot; });
    points.forEach((point, index) =&gt; {
      if (index % 2 === 0 &amp;&amp; point.x &gt;= domainMin &amp;&amp; point.x &lt;= domainMax &amp;&amp; point.y &gt;= domainMin &amp;&amp; point.y &lt;= domainMax) {
        add(contourGroup, &quot;circle&quot;, { cx: xScale(point.x), cy: yScale(point.y), r: 2.5, class: &quot;step-point&quot; });
      }
    });
    add(contourGroup, &quot;circle&quot;, { cx: xScale(-4), cy: yScale(3), r: 5, class: &quot;start-point&quot; });
    add(contourGroup, &quot;circle&quot;, { cx: xScale(0), cy: yScale(0), r: 5, class: &quot;optimum-point&quot; });

    add(svg, &quot;text&quot;, { x: lossPanel.x, y: lossPanel.y - 11, class: &quot;plot-title&quot; }, &quot;Loss over iterations&quot;);
    add(svg, &quot;rect&quot;, { x: lossPanel.x, y: lossPanel.y, width: lossPanel.w, height: lossPanel.h, class: &quot;frame&quot;, &quot;data-chart-frame&quot;: &quot;&quot; });
    const finiteLogs = points.map(point =&gt; Math.log10(Math.max(point.loss, 1e-12))).filter(Number.isFinite);
    let logMin = Math.min(...finiteLogs);
    let logMax = Math.max(...finiteLogs);
    if (logMax - logMin &lt; 1) {
      const midpoint = (logMin + logMax) / 2;
      logMin = midpoint - 0.5;
      logMax = midpoint + 0.5;
    }
    const iterationScale = value =&gt; lossPanel.x + (value / Math.max(1, points.length - 1)) * lossPanel.w;
    const logScale = value =&gt; lossPanel.y + lossPanel.h - ((value - logMin) / (logMax - logMin)) * lossPanel.h;
    const lossPoints = finiteLogs.map((value, index) =&gt; ({ x: index, y: value }));
    const lossGroup = add(svg, &quot;g&quot;, { &quot;clip-path&quot;: &quot;url(#optimizer-loss-clip)&quot; });
    add(lossGroup, &quot;path&quot;, { d: pathFrom(lossPoints, iterationScale, logScale), class: &quot;loss-path&quot; });

    [0, Math.round((points.length - 1) / 2), points.length - 1].forEach((value, index) =&gt; {
      add(svg, &quot;text&quot;, { x: iterationScale(value), y: lossPanel.y + lossPanel.h + 19, &quot;text-anchor&quot;: index === 0 ? &quot;start&quot; : index === 2 ? &quot;end&quot; : &quot;middle&quot; }, String(value));
    });
    [logMin, (logMin + logMax) / 2, logMax].forEach(value =&gt; {
      add(svg, &quot;text&quot;, { x: lossPanel.x - 8, y: logScale(value) + 4, &quot;text-anchor&quot;: &quot;end&quot; }, value.toFixed(1));
    });
    add(svg, &quot;text&quot;, { x: lossPanel.x + lossPanel.w / 2, y: lossPanel.y + lossPanel.h + 40, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;x&quot; }, &quot;Iteration&quot;);
    add(svg, &quot;text&quot;, { x: lossPanel.x - 38, y: lossPanel.y + lossPanel.h / 2, transform: `rotate(-90 ${lossPanel.x - 38} ${lossPanel.y + lossPanel.h / 2})`, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot; }, &quot;log₁₀ loss&quot;);
  }

  Object.values(inputs).forEach(input =&gt; input.addEventListener(&quot;input&quot;, render));
  new ResizeObserver(render).observe(wrap);
  render();
})();
